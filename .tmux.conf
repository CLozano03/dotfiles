# Prefix = Ctrl + Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Prefix + r to reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Conf reload"

set-option -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -g mouse on
set-option -g status-position top

# Set vi-mode
set-window-option -g mode-keys vi

# Set send to inner session (for ssh connection with tmux)
bind-key b send-prefix

# --- STYLE ---
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @plugin "joaofelipegalvao/tokyo-night-tmux"

# --- CONFIGS ---
# Continuum
set -g @continuum-restore 'on'    # Automatically restore the last session on tmux start

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind -n M-H previous-window
bind -n M-K previous-window
bind -n M-L next-window
bind -n M-J next-window

# Splits (vim: :sp / :vs / :q) and zoom (vim: Ctrl-w o)
bind -n M-S split-window -v -c "#{pane_current_path}"
bind -n M-V split-window -h -c "#{pane_current_path}"
bind -n M-Q confirm-before -p "kill pane? (y/n)" kill-pane
bind -n M-O resize-pane -Z

# Resize with hjkl: Alt+Shift+R then h/j/k/l (exits on its own after 1s idle)
set -g repeat-time 1000
bind -n M-R switch-client -T resize
bind -T resize -r h resize-pane -L 5
bind -T resize -r j resize-pane -D 3
bind -T resize -r k resize-pane -U 3
bind -T resize -r l resize-pane -R 5

# Move (swap) pane with hjkl: Alt+Shift+M then h/j/k/l (same repeat behavior)
bind -n M-M switch-client -T move
bind -T move -r h swap-pane -t '{left-of}'
bind -T move -r j swap-pane -t '{down-of}'
bind -T move -r k swap-pane -t '{up-of}'
bind -T move -r l swap-pane -t '{right-of}'

bind-key v copy-mode
set -s set-clipboard on # Enable system clipboard integration

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"

# Initialize TMUX plugin manager 
run '~/.config/tmux/plugins/tpm/tpm'
